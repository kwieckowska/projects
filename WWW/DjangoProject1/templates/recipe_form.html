{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>{{ title }}</h2>

    <div class="card">
        <div class="card-content">
            <form method="post" enctype="multipart/form-data" id="recipe-form" novalidate>
                {% csrf_token %}

                {{ form.as_p }}

                <div class="form-actions">
                    <button type="submit" class="btn">Zapisz</button>
                    <a href="{% url 'recipe_list' %}" class="btn btn-secondary">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
