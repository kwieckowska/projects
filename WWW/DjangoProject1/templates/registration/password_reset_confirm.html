{% extends 'base.html' %}

{% block content %}
<div class="card auth-card">
    <div class="card-content">
        <h2 class="auth-title">Nowe hasło</h2>
        
        {% if validlink %}
            <p class="auth-text">
                Wpisz swoje nowe hasło dwukrotnie, aby je potwierdzić.
            </p>

            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-block">Zmień hasło</button>
            </form>
        {% else %}
            <p class="auth-text text-error">
                Link resetujący jest nieprawidłowy lub wygasł.
            </p>
            <a href="{% url 'password_reset' %}" class="btn btn-block">Wyślij prośbę ponownie</a>
        {% endif %}
    </div>
</div>
{% endblock %}
